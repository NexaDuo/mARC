name: Publish npm launcher

# Keep this filename stable: npm's trusted publisher binds to it and the
# npm-publish environment, which must have maintainer required reviewers.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Assert reviewed release identity, parity and embed release.json
        run: bash scripts/prepare_npm_release.sh
      - name: Test launcher and audit package allowlist
        run: node --test launcher/

  publish:
    needs: test
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Reassert reviewed release identity and rebuild release.json
        run: bash scripts/prepare_npm_release.sh
      - name: Publish with trusted publishing and provenance
        working-directory: launcher
        run: npm publish --access public --provenance
