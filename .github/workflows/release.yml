name: Release

# A GITHUB_TOKEN tag push cannot start another workflow. Keep all release
# surfaces here; npm's trusted publisher binds to release.yml + npm-publish.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      npm: ${{ steps.plan.outputs.npm }}
      sha: ${{ steps.plan.outputs.sha }}
      need_tag: ${{ steps.plan.outputs.need_tag }}
      need_release: ${{ steps.plan.outputs.need_release }}
      need_npm: ${{ steps.plan.outputs.need_npm }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Plan immutable release from main
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_plan.py

  test:
    needs: plan
    if: needs.plan.outputs.need_tag == 'true' || needs.plan.outputs.need_release == 'true' || needs.plan.outputs.need_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
      - name: Test launcher and audit package allowlist
        run: node --test launcher/
      - name: Assert target, ancestry and release parity
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: bash scripts/prepare_npm_release.sh

  tag:
    needs: [plan, test]
    if: needs.plan.outputs.need_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: true
          fetch-depth: 0
      - name: Create and push annotated tag without replacing any remote tag
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -c tag.gpgsign=false tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG"
          remote_tags="$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")"
          if [[ -n "$remote_tags" ]]; then
            echo '::error::Tag appeared after planning; refusing to replace it. Re-run release.'
            exit 1
          fi
          git push origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"

  github-release:
    needs: [plan, tag]
    # Status functions bypass skipped tag dependencies, but failure() also checks
    # ancestors: a failed test must block release even when no tag was needed.
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.need_release == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Release BODY and extractor come from the default branch, including on
      # re-runs. The tag continues to identify its own immutable commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Publish or update GitHub Release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          version="${tag#v}"
          bash scripts/changelog-section.sh "$version" CHANGELOG.md > release-notes.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" --title "$tag" --notes-file release-notes.md --verify-tag
          fi

  publish:
    needs: [plan, tag]
    if: ${{ !cancelled() && !failure() && needs.plan.result == 'success' && needs.plan.outputs.need_npm == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Reassert tag identity and ancestry, parity and embed release.json
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_SHA: ${{ needs.plan.outputs.sha }}
          REQUIRE_RELEASE_TAG: 'true'
        run: bash scripts/prepare_npm_release.sh
      - name: Publish with trusted publishing and provenance
        working-directory: launcher
        run: |
          set -euo pipefail
          remedy='See docs/marc/2026-11-25-decision-npx-launcher.md#bootstrap: publish once with a token, configure release.yml + npm-publish as trusted publisher, then workflow_dispatch on main.'
          if ! npm view @nexaduo/marc name >/dev/null 2>&1; then
            echo "::error::npm package is absent or unreadable; bootstrap is required. $remedy"
            exit 1
          fi
          if ! npm publish --access public --provenance; then
            echo "::error::npm publish failed (including OIDC refusal). $remedy"
            exit 1
          fi
