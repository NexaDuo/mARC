name: Token Consumption Benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  # Issue #291: `release` can never fire in this repo (releases are
  # published by release.yml using GITHUB_TOKEN, and GitHub does not raise
  # workflow events from GITHUB_TOKEN actions), so the real three-arm
  # measurement was permanently unreachable. workflow_dispatch makes it
  # runnable on demand instead. `real_run` defaults to false (the free
  # stub/report path) so a casual dispatch never spends money; it must be
  # explicitly set to run the real measurement — issue #275: 3 tasks x 3
  # arms x 5 iterations = 45 live `claude` invocations if arm A (the
  # previous release) must be re-run, or 30 if its baseline is cached (see
  # scripts/run_token_benchmark.sh's manifest/task-hash reuse logic).
  # Issue #296: publishing was gated to `if: github.event_name == 'release'`
  # alone, and since `release` can never fire, the publish path was
  # unreachable by ANY route (not just the real-measurement path above) — a
  # second layer of the same #291 defect. Fix: a dispatched run publishes
  # docs/the badge when (and only when) it took the real path
  # (`real_run=true`); see the `if:` conditions on "Generate Dashboard
  # Files" / "Commit Dashboard and Benchmarks" below. A dispatched run left
  # at the default `real_run=false` (the stub path) still publishes
  # nothing — it only reports to the job summary and uploads the raw
  # measurement as a workflow artifact, same as before.
  workflow_dispatch:
    inputs:
      real_run:
        description: >-
          Run the REAL three-task, three-arm measurement (costs real API
          money: 30-45 live `claude` invocations, depending on whether the
          previous release's baseline is cached). Leave false to just
          exercise the stub/report path for free.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  benchmark:
    name: Token Telemetry Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run Token Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REAL_RUN_INPUT: ${{ github.event.inputs.real_run }}
        run: |
          bash scripts/run_token_benchmark.sh

      # Issue #291 (second defect): a run's raw measurement — the 12 jsonl
      # files (4 file types: baseline/post/toggle_baseline/toggle_post x 3
      # tasks, issue #275) and the manifest run_token_benchmark.sh generates
      # — must be captured as a workflow artifact BEFORE any commit/push is
      # attempted, and unconditionally (`if: always()`), so a failed publish
      # (e.g. the detached-HEAD push failure this issue also fixes) never
      # again destroys a paid-for measurement. Real run or stub, the upload
      # is cheap; skipping it is what was expensive last time (run
      # 34925472394: nine real `claude` invocations produced numbers that
      # only ever existed on the runner — the task set has since grown to 3
      # tasks (issue #275), so a rerun of that same mistake today would be
      # 30-45 invocations, not nine).
      - name: Upload Raw Benchmark Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-benchmark-raw-${{ github.run_id }}
          path: |
            baseline-*.jsonl
            post-*.jsonl
            toggle_baseline-*.jsonl
            toggle_post-*.jsonl
            task_names.txt
            docs/marc/benchmarks/**/manifest.json
          if-no-files-found: warn
          retention-days: 90

      # Issue #275: per-task, not a single blended number — see
      # scripts/benchmark_report.py's module docstring for why. task_names.txt
      # is written by run_token_benchmark.sh itself (real run or stub) so this
      # step never has to know the task set independently.
      - name: Generate Report
        id: report
        run: |
          python3 scripts/benchmark_report.py --task-names-file task_names.txt --dir "$PWD" > report.txt
          echo "### 📊 Token Consumption Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Regenerated on every PUBLISHING run (see the `if:` below) from the
      # SAME baseline-control.jsonl/post-control.jsonl this job already
      # produced above (origin: #285): --baseline feeds the "Tokens Saved"
      # badge, --path feeds the telemetry.md trend chart, and
      # generate_badge() inside generate_telemetry_dashboard.py now runs
      # unconditionally in the same invocation, so the badge and the
      # dashboard can never diverge (one script run, one data source, one
      # commit). See scripts/test_telemetry_badge_dashboard_same_run.sh for
      # the wired-in regression test.
      # Issue #275: the badge/dashboard need ONE number, but the task set is
      # now three deliberately-different workload shapes, and a sum across
      # them is decoration (see scripts/benchmark_report.py). Rather than
      # invent a blended figure for a public badge, we feed it the "control"
      # task alone (the original, verbatim board.py task this badge always
      # represented pre-#275) — same semantics as before, now explicitly one
      # task among several rather than implicitly the only one.
      # Issue #296: also feed the "neutral" task's noise-floor pair.
      # `neutral` is the task the guard structurally cannot fire on, so any
      # gap between two arms that only differ by the guard's threshold is
      # pure measurement noise, not a guard effect. That pairing MUST be
      # same-commit — arm C (toggle_baseline, guard=999999) vs arm B
      # (toggle_post, guard=350), the codebase's own "Causal Proof" pairing
      # — never baseline-neutral.jsonl/post-neutral.jsonl (arm A, the
      # PREVIOUS release, vs arm B). That inter-release pairing differs by
      # both release AND threshold, so it would absorb ordinary release-to-
      # release drift into the floor and silently inflate it over time,
      # suppressing real findings (review on PR #297 caught this — the
      # first version of this step used the wrong pairing). See
      # generate_badge()'s docstring in generate_telemetry_dashboard.py.
      # Issue #291/#296: publishing (this step and "Commit Dashboard and
      # Benchmarks" below) now runs on a `release` event OR a
      # `workflow_dispatch` run that opted into the real measurement
      # (`real_run=true`) — see the trigger comment at the top of this file.
      # A dispatched run left at the default `real_run=false` never reaches
      # here (job summary + artifact only, same as always).
      - name: Generate Dashboard Files
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.real_run == 'true')
        run: |
          python3 scripts/generate_telemetry_dashboard.py \
            --path post-control.jsonl --baseline baseline-control.jsonl \
            --neutral-no-guard toggle_baseline-neutral.jsonl --neutral-guarded toggle_post-neutral.jsonl

      # Issue #291 (second defect): on a `release` event actions/checkout
      # checks out the tag, leaving the workspace in detached HEAD. `git
      # commit` succeeds there (it did, in run 34925472394), but a plain
      # `git push` then fails with "fatal: You are not currently on a
      # branch." — nothing published, the measurement stranded on the
      # runner. Fix: push the detached commit directly onto the remote
      # `main` branch by ref-spec (`HEAD:refs/heads/main`) instead of
      # relying on being "on" a branch locally. This never puts the runner
      # itself on a branch, so it works whether the checkout is detached
      # (release) or already on a branch (a `workflow_dispatch` real run
      # checks out `main` un-detached — the ref-spec push works there too,
      # unchanged).
      - name: Commit Dashboard and Benchmarks
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.real_run == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marc/telemetry.md docs/marc/telemetry-badge.json docs/marc/benchmarks/
          git commit -m "docs: auto-update telemetry dashboard and cache benchmarks" || true
          git push origin HEAD:refs/heads/main

      # Deliberately no PR-comment step. On `pull_request` (and `push`) events
      # `Run Token Benchmark` always takes the stub branch of
      # scripts/run_token_benchmark.sh (there is no previous release tag to
      # A/B against on a PR), so any report generated here is synthetic —
      # never a real measurement. Per issue #274's acceptance criteria, stub
      # output for smoke-testing the report scripts stays confined to the
      # job summary (`Generate Report`, above); it must never be posted as a
      # public PR comment, which reads to a human as an announced result. A
      # prior version of this workflow posted such a comment
      # (`Percentage saved: 15.2%` on stub inputs) on every PR, which is the
      # exact fabrication #274 was reopened over — see
      # scripts/test_token_benchmark_no_pr_comment.sh for the regression
      # test guarding this.
