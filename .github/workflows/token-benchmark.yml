name: Token Consumption Benchmark

on:
  push:
    branches: [main]
    # Issue #304 used to key the paid path off a release-shaped TAG PUSH
    # itself. Issue #309 found the cost of that: CI would spend real API
    # credit on any release-shaped tag push, with no human confirming the
    # spend at that moment. The owner decided the paid measurement runs
    # locally, by hand, at release time instead (docs/marc/benchmarks/
    # README.md has the exact command).
    #
    # This workflow still triggers on a tag push (kept so the free
    # stub/report path -- job summary + artifact -- still exercises itself
    # on every release, same as any other push) but
    # scripts/run_token_benchmark.sh's is_real_run() no longer looks at tag
    # shape at all: EVERY tag push, release-shaped or not, takes the free
    # stub path now. See is_real_run()'s own comment for the full rule.
    tags:
      - "v*.*.*"
  pull_request:
    types: [opened, synchronize, reopened]
  # Issue #291/#309: workflow_dispatch is now the ONLY reachable trigger for
  # the real measurement -- an explicit, one-off human action, never an
  # automatic consequence of pushing a tag or a branch. `real_run` defaults
  # to false (the free stub/report path) so a casual dispatch never spends
  # money; it must be explicitly set to "true" -- issue #275: 3 tasks x 3
  # arms x 5 iterations = 45 live `claude` invocations if arm A (the
  # previous release) must be re-run, or 30 if its cached baseline resolves
  # (see scripts/run_token_benchmark.sh's manifest/task-hash reuse logic and
  # resolve_prev_release_tag()). The owner's preferred way to take this real
  # path is actually running the script locally (docs/marc/benchmarks/
  # README.md), not dispatching this workflow -- but the dispatch path
  # stays, for the rare case CI itself needs to run it, gated the same way.
  # Issue #296: publishing was gated to `if: github.event_name == 'release'`
  # alone, and since `release` can never fire, the publish path was
  # unreachable by ANY route (not just the real-measurement path above) — a
  # second layer of the same #291 defect. Fix (issue #304/#309 supersede the
  # mechanism, keeping the intent): the "Run Token Benchmark" step below
  # exports whether it took the real path as a step output
  # (`steps.run_benchmark.outputs.real_run`), computed by the SAME
  # is_real_run() the script uses for everything else -- see the `if:`
  # conditions on "Generate Dashboard Files" / "Commit Dashboard and
  # Benchmarks" below. A run left on the stub path (any tag push, push to
  # main, PR, or a workflow_dispatch left at its default `real_run=false`)
  # still publishes nothing — it only reports to the job summary and
  # uploads the raw measurement as a workflow artifact, same as before.
  workflow_dispatch:
    inputs:
      real_run:
        description: >-
          Run the REAL three-task, three-arm measurement (costs real API
          money: 30-45 live `claude` invocations, depending on whether the
          previous release's baseline is cached). Leave false to just
          exercise the stub/report path for free.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  benchmark:
    name: Token Telemetry Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run Token Benchmark
        id: run_benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REAL_RUN_INPUT: ${{ github.event.inputs.real_run }}
        run: |
          bash scripts/run_token_benchmark.sh

      # Issue #291 (second defect): a run's raw measurement — the 12 jsonl
      # files (4 file types: baseline/post/toggle_baseline/toggle_post x 3
      # tasks, issue #275) and the manifest run_token_benchmark.sh generates
      # — must be captured as a workflow artifact BEFORE any commit/push is
      # attempted, and unconditionally (`if: always()`), so a failed publish
      # (e.g. the detached-HEAD push failure this issue also fixes) never
      # again destroys a paid-for measurement. Real run or stub, the upload
      # is cheap; skipping it is what was expensive last time (run
      # 34925472394: nine real `claude` invocations produced numbers that
      # only ever existed on the runner — the task set has since grown to 3
      # tasks (issue #275), so a rerun of that same mistake today would be
      # 30-45 invocations, not nine).
      - name: Upload Raw Benchmark Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-benchmark-raw-${{ github.run_id }}
          path: |
            baseline-*.jsonl
            post-*.jsonl
            toggle_baseline-*.jsonl
            toggle_post-*.jsonl
            task_names.txt
            docs/marc/benchmarks/**/manifest.json
          if-no-files-found: warn
          retention-days: 90

      # Issue #275: per-task, not a single blended number — see
      # scripts/benchmark_report.py's module docstring for why. task_names.txt
      # is written by run_token_benchmark.sh itself (real run or stub) so this
      # step never has to know the task set independently.
      - name: Generate Report
        id: report
        run: |
          # Issue #295 (AC2/AC3): --iterations is only passed when
          # run_token_benchmark.sh actually wrote iterations.txt, which it
          # does ONLY on the real measurement path. The free stub path
          # always emits fixed n=2 fixture samples regardless of the real
          # ITERATIONS constant, so it must never trip the shortfall/
          # untrustworthy gate below.
          ITER_ARGS=()
          if [ -f iterations.txt ]; then
            ITER_ARGS=(--iterations "$(cat iterations.txt)")
          fi
          # report.txt is written via redirection before checking the
          # script's exit status, so a failing (untrustworthy-data) report
          # still gets copied into $GITHUB_STEP_SUMMARY below before this
          # step exits non-zero -- only the job itself goes red. NOTE:
          # report.txt itself is NOT part of the "Upload Raw Benchmark Data"
          # artifact above (that step only captures the raw *.jsonl/
          # task_names.txt/manifest.json inputs, uploaded unconditionally
          # BEFORE this step runs) -- the job summary is the only place the
          # rendered report text is preserved.
          set +e
          python3 scripts/benchmark_report.py --task-names-file task_names.txt --dir "$PWD" "${ITER_ARGS[@]}" > report.txt
          REPORT_EXIT=$?
          set -e
          echo "### 📊 Token Consumption Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit $REPORT_EXIT

      # Regenerated on every PUBLISHING run (see the `if:` below) from the
      # SAME baseline-control.jsonl/post-control.jsonl this job already
      # produced above (origin: #285): --baseline feeds the "Tokens Saved"
      # badge, --path feeds the telemetry.md trend chart, and
      # generate_badge() inside generate_telemetry_dashboard.py now runs
      # unconditionally in the same invocation, so the badge and the
      # dashboard can never diverge (one script run, one data source, one
      # commit). See scripts/test_telemetry_badge_dashboard_same_run.sh for
      # the wired-in regression test.
      # Issue #275: the badge/dashboard need ONE number, but the task set is
      # now three deliberately-different workload shapes, and a sum across
      # them is decoration (see scripts/benchmark_report.py). Rather than
      # invent a blended figure for a public badge, we feed it the "control"
      # task alone (the original, verbatim board.py task this badge always
      # represented pre-#275) — same semantics as before, now explicitly one
      # task among several rather than implicitly the only one.
      # Issue #303: --badge-current is `toggle_baseline-control.jsonl` (arm
      # C, guard=999999, i.e. structurally off), NOT `post-control.jsonl`
      # (arm B, guard=350) — the read-guard ships opt-in and DISABLED (no
      # `[token_guard]` in .agents/team.toml; the template ships it
      # commented out), so arm C's guard-off, same-commit behavior is what a
      # real user on the shipped default actually experiences. Arm A
      # (baseline-control.jsonl, the previous release) also never configures
      # `[token_guard]`, so this keeps both sides of the badge's diff on the
      # same "guard off" footing. Feeding the badge arm B previously
      # inverted its sign relative to reality (run 34987534132: -68.9% from
      # arm B vs +35.0% from arm C on the exact same current-commit data).
      # --path stays `post-control.jsonl` for the markdown trend chart only
      # (unrelated to the badge computation as of this fix).
      # Issue #296: also feed the "neutral" task's noise-floor pair.
      # `neutral` is the task the guard structurally cannot fire on, so any
      # gap between two arms that only differ by the guard's threshold is
      # pure measurement noise, not a guard effect. That pairing MUST be
      # same-commit — arm C (toggle_baseline, guard=999999) vs arm B
      # (toggle_post, guard=350), the codebase's own "Causal Proof" pairing
      # — never baseline-neutral.jsonl/post-neutral.jsonl (arm A, the
      # PREVIOUS release, vs arm B). That inter-release pairing differs by
      # both release AND threshold, so it would absorb ordinary release-to-
      # release drift into the floor and silently inflate it over time,
      # suppressing real findings (review on PR #297 caught this — the
      # first version of this step used the wrong pairing). See
      # generate_badge()'s docstring in generate_telemetry_dashboard.py.
      # Issue #291/#296/#304/#309: publishing (this step and "Commit
      # Dashboard and Benchmarks" below) runs exactly when "Run Token
      # Benchmark" took the real (paid) path — only a `workflow_dispatch`
      # run that explicitly opted in (`real_run=true`); no tag push, of any
      # shape, ever reaches here automatically anymore — see the trigger
      # comment at the top of this file. Both steps read the SAME
      # `steps.run_benchmark.outputs.real_run` output computed once by
      # is_real_run() in scripts/run_token_benchmark.sh, rather than
      # re-deriving the decision here in a second, independently-maintained
      # expression — the class of bug #296's review caught (two hand-written
      # conditions of the same fact silently drifting apart). Any tag push,
      # a push to main, a PR, or a dispatch left at the default
      # `real_run=false` never reaches here (job summary + artifact only,
      # same as always).
      - name: Generate Dashboard Files
        if: steps.run_benchmark.outputs.real_run == 'true'
        run: |
          python3 scripts/generate_telemetry_dashboard.py \
            --path post-control.jsonl --baseline baseline-control.jsonl \
            --badge-current toggle_baseline-control.jsonl \
            --neutral-no-guard toggle_baseline-neutral.jsonl --neutral-guarded toggle_post-neutral.jsonl

      # Issue #291 (second defect): on a tag push (or the old, now-removed
      # `release` event) actions/checkout checks out the tag, leaving the
      # workspace in detached HEAD. `git commit` succeeds there (it did, in
      # run 34925472394), but a plain `git push` then fails with "fatal: You
      # are not currently on a branch." — nothing published, the measurement
      # stranded on the runner. Fix: push the detached commit directly onto
      # the remote `main` branch by ref-spec (`HEAD:refs/heads/main`)
      # instead of relying on being "on" a branch locally. This never puts
      # the runner itself on a branch, so it works whether the checkout is
      # detached (a release-tag push) or already on a branch (a
      # `workflow_dispatch` real run checks out `main` un-detached — the
      # ref-spec push works there too, unchanged).
      - name: Commit Dashboard and Benchmarks
        if: steps.run_benchmark.outputs.real_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marc/telemetry.md docs/marc/telemetry-badge.json docs/marc/benchmarks/
          git commit -m "docs: auto-update telemetry dashboard and cache benchmarks" || true
          git push origin HEAD:refs/heads/main

      # Deliberately no PR-comment step. On `pull_request` (and `push`) events
      # `Run Token Benchmark` always takes the stub branch of
      # scripts/run_token_benchmark.sh (there is no previous release tag to
      # A/B against on a PR), so any report generated here is synthetic —
      # never a real measurement. Per issue #274's acceptance criteria, stub
      # output for smoke-testing the report scripts stays confined to the
      # job summary (`Generate Report`, above); it must never be posted as a
      # public PR comment, which reads to a human as an announced result. A
      # prior version of this workflow posted such a comment
      # (`Percentage saved: 15.2%` on stub inputs) on every PR, which is the
      # exact fabrication #274 was reopened over — see
      # scripts/test_token_benchmark_no_pr_comment.sh for the regression
      # test guarding this.
