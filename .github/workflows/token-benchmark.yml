name: Token Consumption Benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

permissions:
  pull-requests: write
  contents: write

jobs:
  benchmark:
    name: Token Telemetry Benchmark
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: github.event_name == 'release'
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin marketplace add ./
          claude plugin install marc@nexaduo

      - name: Execute Real LLM Task
        if: github.event_name == 'release'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p .agents
          echo "[telemetry]" > .agents/team.toml
          echo "enabled = true" >> .agents/team.toml
          
          # Run the task
          claude -p "read core/scripts/board.py and output a summary"
          
          # Copy telemetry to expected names
          if [ -f ~/.claude/marc-state/token-telemetry.jsonl ]; then
            cp ~/.claude/marc-state/token-telemetry.jsonl post.jsonl
            touch baseline.jsonl
          else
            echo "Warning: Telemetry file not found"
            touch baseline.jsonl post.jsonl
          fi

      - name: Generate stub telemetry for PR/push
        if: github.event_name != 'release'
        run: |
          cat << 'JSON' > baseline.jsonl
          {"session_id": "sess-baseline-1", "weighted": 15000, "turns": 5, "model": "stub-model", "timestamp": 1700000000}
          {"session_id": "sess-baseline-2", "weighted": 8000, "turns": 3, "model": "stub-model", "timestamp": 1700000100}
          JSON
          cat << 'JSON' > post.jsonl
          {"session_id": "sess-post-1", "weighted": 12000, "turns": 4, "model": "stub-model", "timestamp": 1700000200}
          {"session_id": "sess-post-2", "weighted": 7500, "turns": 3, "model": "stub-model", "timestamp": 1700000300}
          JSON

      - name: Generate Report
        id: report
        run: |
          python3 core/scripts/token_telemetry_report.py --path post.jsonl > report.txt || true
          echo "REPORT<<EOF" >> $GITHUB_ENV
          cat report.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "### 📊 Token Consumption Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate Dashboard Files
        if: github.event_name == 'release'
        run: |
          python3 scripts/generate_telemetry_dashboard.py --path post.jsonl
          
      - name: Commit Dashboard
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marc/telemetry.md docs/marc/telemetry-badge.json
          git commit -m "docs: auto-update telemetry dashboard" || true
          git push

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "### 📊 Token Consumption Benchmark Report
          
          \`\`\`text
          ${{ env.REPORT }}
          \`\`\`
          " || true
