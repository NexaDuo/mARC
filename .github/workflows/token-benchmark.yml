name: Token Consumption Benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]

permissions:
  pull-requests: write
  contents: write

jobs:
  benchmark:
    name: Token Telemetry Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run Token Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          bash scripts/run_token_benchmark.sh

      - name: Generate Report
        id: report
        run: |
          echo "## Inter-release Comparison (Previous Release vs Current)" > report.txt
          python3 core/scripts/token_telemetry_report.py --path baseline.jsonl --compare post.jsonl >> report.txt
          echo "" >> report.txt
          echo "## Causal Proof (No Guard vs Guard=350 in Current)" >> report.txt
          python3 core/scripts/token_telemetry_report.py --path toggle_baseline.jsonl --compare toggle_post.jsonl >> report.txt
          echo "REPORT<<EOF" >> $GITHUB_ENV
          cat report.txt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "### 📊 Token Consumption Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Generate Dashboard Files
        if: github.event_name == 'release'
        run: |
          python3 scripts/generate_telemetry_dashboard.py --path post.jsonl
          
      - name: Commit Dashboard and Benchmarks
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marc/telemetry.md docs/marc/telemetry-badge.json docs/marc/benchmarks/
          git commit -m "docs: auto-update telemetry dashboard and cache benchmarks" || true
          git push

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "### 📊 Token Consumption Benchmark Report
          
          \`\`\`text
          ${{ env.REPORT }}
          \`\`\`
          " || true
