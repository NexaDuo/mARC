name: Token Consumption Benchmark

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  release:
    types: [published]
  # Issue #291: `release` can never fire in this repo (releases are
  # published by release.yml using GITHUB_TOKEN, and GitHub does not raise
  # workflow events from GITHUB_TOKEN actions), so the real three-arm
  # measurement was permanently unreachable. workflow_dispatch makes it
  # runnable on demand instead. `real_run` defaults to false (the free
  # stub/report path) so a casual dispatch never spends money; it must be
  # explicitly set to run the real measurement — issue #293: 4 tasks x 3
  # arms x 5 iterations = 60 live `claude` invocations if arm A (the
  # previous release) must be re-run, or 40 if its baseline is cached (see
  # scripts/run_token_benchmark.sh's manifest/task-hash reuse logic).
  # A dispatched run NEVER commits/pushes docs or publishes the badge (see
  # the `if: github.event_name == 'release'` gates below) — only a
  # `release` event may publish. It only reports to the job summary and
  # uploads the raw measurement as a workflow artifact.
  workflow_dispatch:
    inputs:
      real_run:
        description: >-
          Run the REAL four-task, three-arm measurement (costs real API
          money: 40-60 live `claude` invocations, depending on whether the
          previous release's baseline is cached). Leave false to just
          exercise the stub/report path for free.
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  benchmark:
    name: Token Telemetry Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Run Token Benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REAL_RUN_INPUT: ${{ github.event.inputs.real_run }}
        run: |
          bash scripts/run_token_benchmark.sh

      # Issue #291 (second defect): a run's raw measurement — the 16 jsonl
      # files (4 file types: baseline/post/toggle_baseline/toggle_post x 4
      # tasks, issue #293) and the manifest run_token_benchmark.sh generates
      # — must be captured as a workflow artifact BEFORE any commit/push is
      # attempted, and unconditionally (`if: always()`), so a failed publish
      # (e.g. the detached-HEAD push failure this issue also fixes) never
      # again destroys a paid-for measurement. Real run or stub, the upload
      # is cheap; skipping it is what was expensive last time (run
      # 34925472394: nine real `claude` invocations produced numbers that
      # only ever existed on the runner — the task set has since grown to 4
      # tasks (issue #293), so a rerun of that same mistake today would be
      # 40-60 invocations, not nine).
      - name: Upload Raw Benchmark Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: token-benchmark-raw-${{ github.run_id }}
          path: |
            baseline-*.jsonl
            post-*.jsonl
            toggle_baseline-*.jsonl
            toggle_post-*.jsonl
            task_names.txt
            docs/marc/benchmarks/**/manifest.json
          if-no-files-found: warn
          retention-days: 90

      # Issue #275: per-task, not a single blended number — see
      # scripts/benchmark_report.py's module docstring for why. task_names.txt
      # is written by run_token_benchmark.sh itself (real run or stub) so this
      # step never has to know the task set independently.
      - name: Generate Report
        id: report
        run: |
          python3 scripts/benchmark_report.py --task-names-file task_names.txt --dir "$PWD" > report.txt
          echo "### 📊 Token Consumption Benchmark Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          cat report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      # Regenerated on every release from the SAME baseline-control.jsonl/
      # post-control.jsonl this job already produced above (origin: #285):
      # --baseline feeds the
      # "Tokens Saved" badge, --path feeds the telemetry.md trend chart, and
      # generate_badge() inside generate_telemetry_dashboard.py now runs
      # unconditionally in the same invocation, so the badge and the
      # dashboard can never diverge (one script run, one data source, one
      # commit). See scripts/test_telemetry_badge_dashboard_same_run.sh for
      # the wired-in regression test.
      # Issue #275: the badge/dashboard need ONE number, but the task set is
      # now four deliberately-different workload shapes (issue #293 added
      # `fixture`, a synthetic calibration control), and a sum across them is
      # decoration (see scripts/benchmark_report.py). Rather than invent a
      # blended figure for a public badge, we feed it the "control" task
      # alone (the original, verbatim board.py task this badge always
      # represented pre-#275) — same semantics as before, now explicitly one
      # task among several rather than implicitly the only one. `fixture` in
      # particular must NEVER feed this: it is instrument calibration, not a
      # claim about real work (see scripts/generate_benchmark_fixture.py).
      - name: Generate Dashboard Files
        if: github.event_name == 'release'
        run: |
          python3 scripts/generate_telemetry_dashboard.py --path post-control.jsonl --baseline baseline-control.jsonl

      # Issue #291 (second defect): on a `release` event actions/checkout
      # checks out the tag, leaving the workspace in detached HEAD. `git
      # commit` succeeds there (it did, in run 34925472394), but a plain
      # `git push` then fails with "fatal: You are not currently on a
      # branch." — nothing published, the measurement stranded on the
      # runner. Fix: push the detached commit directly onto the remote
      # `main` branch by ref-spec (`HEAD:refs/heads/main`) instead of
      # relying on being "on" a branch locally. This never puts the runner
      # itself on a branch, so it works whether the checkout is detached
      # (release) or already on a branch (any future trigger that reaches
      # this step).
      - name: Commit Dashboard and Benchmarks
        if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/marc/telemetry.md docs/marc/telemetry-badge.json docs/marc/benchmarks/
          git commit -m "docs: auto-update telemetry dashboard and cache benchmarks" || true
          git push origin HEAD:refs/heads/main

      # Deliberately no PR-comment step. On `pull_request` (and `push`) events
      # `Run Token Benchmark` always takes the stub branch of
      # scripts/run_token_benchmark.sh (there is no previous release tag to
      # A/B against on a PR), so any report generated here is synthetic —
      # never a real measurement. Per issue #274's acceptance criteria, stub
      # output for smoke-testing the report scripts stays confined to the
      # job summary (`Generate Report`, above); it must never be posted as a
      # public PR comment, which reads to a human as an announced result. A
      # prior version of this workflow posted such a comment
      # (`Percentage saved: 15.2%` on stub inputs) on every PR, which is the
      # exact fabrication #274 was reopened over — see
      # scripts/test_token_benchmark_no_pr_comment.sh for the regression
      # test guarding this.
