name: CI

# First CI for NexaDuo/mARC (issue #5).
# Proves — deterministically and at ZERO token cost — that the mARC plugin
# VALIDATES, INSTALLS, and REGISTERS its skill/agents, including cross-repo.
# There is no official Claude Code GitHub Action; we install the CLI via npm.
#
# Scope: Tier 1 (structural) + Tier 2 (install / cross-repo). No Tier 3
# (headless execution) — that needs ANTHROPIC_API_KEY + real API cost and lives
# in the disabled `execution-eval.yml` stub.
#
# Empirical finding (verified in-workflow, see the "auth boundary" step below):
# `claude plugin install marc@nexaduo` runs WITHOUT ANTHROPIC_API_KEY and makes
# no token-costing API call — it only clones/copies the marketplace repo. So the
# gate uses the REAL install path and needs NO secret.

on:
  push:
  pull_request:

# Nothing here reads or needs any secret. Keep it that way (Tier 1 + Tier 2).
permissions:
  contents: read

env:
  # Pin the CLI for reproducibility. BUMP: bump this to adopt a newer Claude Code
  # (latest verified working: 2.1.200). Node 22+ is required by the CLI.
  CLAUDE_CODE_VERSION: "2.1.200"
  # Pin the GitHub Copilot CLI for reproducibility (latest verified working:
  # 1.0.72). Empirically confirmed (issue #127 AC#1): `copilot plugin install`
  # and `copilot plugin marketplace add` both run with NO auth token at all
  # (GH_TOKEN/GITHUB_TOKEN/COPILOT_GITHUB_TOKEN unset) — they only read/copy the
  # local marketplace directory, same no-auth-needed shape as `claude plugin
  # install`. No secret is required for this gate.
  COPILOT_CLI_VERSION: "1.0.72"

jobs:
  # ---------------------------------------------------------------------------
  # Tier 1 — structural. Hard gate, no secret, no `claude` install needed except
  # for `plugin validate`.
  # ---------------------------------------------------------------------------
  structural:
    name: Tier 1 — structural
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify compiled prompts are up-to-date
        run: |
          python3 scripts/compile_prompts.py
          if ! git diff --exit-code; then
            echo "::error::Compiled prompts are out of sync with core/ templates. Run 'python3 scripts/compile_prompts.py' and commit the changes."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI (pinned)
        run: |
          npm i -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      # 2. Plugin manifest validation. `--bare` for reproducible output.
      #    NOTE: we intentionally do NOT pass `--strict`: the manifest carries a
      #    `minimumVersion` field that the runtime tolerates but reports as an
      #    "unknown field" warning. That warning is expected and benign — do not
      #    "fix" it by deleting the field.
      - name: claude plugin validate
        run: claude --bare plugin validate harnesses/claude-code/marc

      # 3. Both JSON manifests must parse.
      - name: jq parse manifests
        run: |
          jq . .github/plugin/marketplace.json > /dev/null
          jq . .claude-plugin/marketplace.json > /dev/null
          jq . harnesses/claude-code/marc/.claude-plugin/plugin.json > /dev/null
          jq . harnesses/antigravity/marc/plugin.json > /dev/null
          jq . harnesses/copilot/marc/plugin.json > /dev/null

      - name: Copilot harness structure gate
        run: |
          test -f harnesses/copilot/marc/compile.json
          test -f harnesses/copilot/marc/plugin.json
          test -f harnesses/copilot/marc/hooks/hooks.json
          # scripts/ is a real, self-contained directory (not a symlink out to
          # harnesses/claude-code/marc/scripts): a `owner/repo:harnesses/copilot/marc`
          # subpath install only checks out this subtree, so an off-tree symlink
          # dangles there. Ship physical copies instead (origin: issue on PR #122).
          test -d harnesses/copilot/marc/scripts && ! test -L harnesses/copilot/marc/scripts
          test -f harnesses/copilot/marc/scripts/token_sentinel.py
          jq -e '.version == 1 and (.hooks | type == "object")' harnesses/copilot/marc/hooks/hooks.json > /dev/null
          echo "Copilot harness structure gate: OK (compile.json/plugin.json/hooks schema/self-contained scripts present)."

      # 3b. team.toml schema contract (issue #51). `/marc:init` (skills/init)
      #     prefills a `.agents/team.toml` from this canonical example, so it
      #     must (a) parse as valid TOML, (b) keep the required GitHub-binding
      #     keys, (c) keep every KEY NAME UNIQUE across the whole file — the
      #     plugin's shell snippets extract values with ZERO dependencies (no
      #     TOML CLI on consumer machines) via key-anchored sed, which silently
      #     picks the wrong value if two sections reuse a name — and (d) stay
      #     extractable by that exact sed pattern. python3/tomllib is fine HERE:
      #     the zero-dependency rule applies to consumer machines at runtime,
      #     not to CI runners. Deterministic, zero token cost.
      - name: team.toml schema contract
        run: |
          check_schema() {
            f="$1"
            python3 - "$f" <<'PY'
          import sys, tomllib
          path = sys.argv[1]
          # (a) valid TOML.
          try:
              with open(path, "rb") as fh:
                  data = tomllib.load(fh)
          except (OSError, tomllib.TOMLDecodeError) as e:
              print(f"::error::{path}: not valid TOML — {e}"); sys.exit(1)
          # (c) key names unique across ALL sections (shell-extraction contract).
          keys = [k for section in data.values() if isinstance(section, dict)
                  for k in section]
          dupes = sorted({k for k in keys if keys.count(k) > 1})
          if dupes:
              print(f"::error::{path}: key name(s) reused across sections "
                    f"(breaks zero-dependency sed extraction): {dupes}")
              sys.exit(1)
          # (b) required GitHub-binding keys present.
          gh = data.get("github", {})
          missing = [k for k in ("gh_org", "gh_repo") if k not in gh]
          if missing:
              print(f"::error::{path}: missing required [github] key(s): {missing}")
              sys.exit(1)
          PY
          }

          # POSITIVE: the canonical example must pass.
          check_schema docs/team.toml.example \
            || { echo "::error::team.toml.example failed schema contract"; exit 1; }

          # (d) The documented zero-dependency sed extraction must agree with a
          # real TOML parser on the required keys.
          for k in gh_org gh_repo; do
            sed_val="$(sed -n 's/^ *'"$k"' *= *"\{0,1\}\([^"#]*\)"\{0,1\}.*/\1/p' docs/team.toml.example | sed 's/ *$//' | head -n1)"
            py_val="$(python3 -c 'import sys, tomllib; print(tomllib.load(open("docs/team.toml.example","rb"))["github"][sys.argv[1]])' "$k")"
            [ "$sed_val" = "$py_val" ] \
              || { echo "::error::zero-dependency sed extraction of $k ('$sed_val') disagrees with tomllib ('$py_val')"; exit 1; }
          done

          # NEGATIVE 1: invalid TOML MUST be rejected.
          tmp="$(mktemp)"
          printf '%s\n' '[github]' 'gh_org = unquoted bare string' > "$tmp"
          if check_schema "$tmp" > /dev/null 2>&1; then
            echo "::error::negative test 1 FAILED — invalid TOML was NOT rejected"; rm -f "$tmp"; exit 1
          fi

          # NEGATIVE 2: a key name reused across sections MUST be rejected
          # (it would silently break the sed-based extraction).
          printf '%s\n' \
            '[github]' 'gh_org = "YourOrg"' 'gh_repo = "YourOrg/your-repo"' \
            '[paths]'  'gh_repo = "oops-reused-name"' > "$tmp"
          if check_schema "$tmp" > /dev/null 2>&1; then
            echo "::error::negative test 2 FAILED — duplicate key name across sections was NOT rejected"; rm -f "$tmp"; exit 1
          fi
          rm -f "$tmp"

          echo "team.toml schema contract: OK (valid TOML; gh_org/gh_repo present; key names unique file-wide; sed extraction agrees with tomllib; negative tests rejected invalid TOML + reused key name)."

      # 4. YAML frontmatter lint of every agent + skill file. Extracts the
      #    `---`-delimited frontmatter and yaml.safe_load()s it. This catches the
      #    class of bug where an unquoted `": "` inside a `description:` value
      #    (e.g. the old security.md) makes the frontmatter invalid YAML and
      #    silently breaks `plugin validate`.
      - name: YAML frontmatter lint
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          files = sorted(
              glob.glob("core/agents/*.md")
              + glob.glob("core/skills/**/SKILL.md", recursive=True)
              + glob.glob("harnesses/*/marc/agents/*.md")
              + glob.glob("harnesses/*/marc/skills/**/SKILL.md", recursive=True)
          )
          if not files:
              print("ERROR: no agent/skill files found — glob paths wrong?")
              sys.exit(1)
          bad = 0
          for f in files:
              text = open(f, encoding="utf-8").read()
              if not text.startswith("---"):
                  print(f"FAIL {f}: missing frontmatter (no leading '---')")
                  bad += 1
                  continue
              # frontmatter = between the first '---' and the next '---' line
              parts = text.split("\n")
              try:
                  end = parts.index("---", 1)
              except ValueError:
                  print(f"FAIL {f}: unterminated frontmatter (no closing '---')")
                  bad += 1
                  continue
              fm = "\n".join(parts[1:end])
              try:
                  data = yaml.safe_load(fm)
              except yaml.YAMLError as e:
                  print(f"FAIL {f}: frontmatter is not valid YAML: {e}")
                  bad += 1
                  continue
              if not isinstance(data, dict) or "name" not in data:
                  print(f"FAIL {f}: frontmatter missing required 'name' key")
                  bad += 1
                  continue
              print(f"ok   {f}")
          if bad:
              print(f"\n{bad} file(s) failed frontmatter lint")
              sys.exit(1)
          print(f"\nAll {len(files)} frontmatter block(s) parsed OK")
          PY

      # 5. Anti-anchoring gate: the reusable, cross-repo agent/skill ROLE prose
      #    must not hardcode this-repo/consumer specifics. The NexaDuo name is
      #    allowed in the manifests / README / install.sh (branding); the gate is
      #    scoped to agents/ + skills/ prose only.
      - name: Anti-anchoring grep gate
        run: |
          if grep -rniE 'nexaduo|chat-services|run-stack|middleware/|chatwoot|dify|instagram' \
               core/agents \
               core/skills \
               harnesses/*/marc/agents \
               harnesses/*/marc/skills; then
            echo "::error::Anti-anchoring gate: consumer/this-repo specifics found in agent/skill role prose (see hits above)."
            exit 1
          fi
          echo "Anti-anchoring gate: clean (zero hits)."

      # 5b. Self-improvement context-gating gate (issue #20). The tech-lead skill
      #     MUST gate its "capture process improvements into versioned source /
      #     buffer-flush" behavior by context: plugin self-edits + upstream PRs
      #     are legitimate ONLY in the plugin's own source repo (dogfooding); in a
      #     consumer repo the operator MUST NOT edit the plugin or open autonomous
      #     upstream PRs. This asserts the guard prose survives edits. Deterministic,
      #     zero token cost — a grep over required guard phrases, no live model.
      - name: Self-improvement context-gating gate
        run: |
          # This gate asserts a concrete runtime probe (a literal path a
          # plugin.json context-detection check greps for), not just prose
          # shape, so it targets the COMPILED Claude Code output, where
          # `{{ plugin_manifest_path }}` has been substituted with the real
          # `.claude-plugin/plugin.json` path. core/skills/tech-lead/SKILL.md
          # is the harness-neutral template and carries the placeholder token
          # by design; the format/anti-anchoring/rule-origin gates elsewhere
          # in this workflow still assert against core/ prose directly.
          SKILL=harnesses/claude-code/marc/skills/tech-lead/SKILL.md
          # Reusable check: every required guard phrase must be present in $1.
          # Phrases are matched case-insensitively, each on its own line in the
          # source, so a whole-file scan is unnecessary.
          check_guard() {
            f="$1"
            test -f "$f" || { echo "::error::$f missing"; return 1; }
            # (a) context detection is present and generic (runtime plugin.json probe).
            grep -qiE 'gated by context' "$f" \
              || { echo "::error::$f missing 'gated by context' rule"; return 1; }
            grep -qiE '\.claude-plugin/plugin\.json' "$f" \
              || { echo "::error::$f missing plugin.json context-detection probe"; return 1; }
            # (b) explicit prohibition on editing the plugin from a consumer repo.
            grep -qiE 'MUST NOT.*edit the plugin' "$f" \
              || { echo "::error::$f missing 'MUST NOT edit the plugin' prohibition"; return 1; }
            # (c) explicit prohibition on autonomous upstream PRs from a consumer repo.
            grep -qiE 'autonomous upstream pull request' "$f" \
              || { echo "::error::$f missing 'autonomous upstream pull request' prohibition"; return 1; }
            # (d) upstream-worthy lessons deferred to the sanctioned opt-in channel.
            grep -qiE 'issue #22' "$f" \
              || { echo "::error::$f missing deferral to the opt-in upstream channel (issue #22)"; return 1; }
            return 0
          }

          # POSITIVE: the shipped SKILL.md must carry every guard phrase.
          check_guard "$SKILL" \
            || { echo "::error::tech-lead SKILL.md failed the context-gating guard"; exit 1; }

          # NEGATIVE: a copy with the upstream-PR prohibition stripped MUST fail,
          # proving the gate actually catches regression of the guard prose.
          tmp="$(mktemp)"
          grep -v 'autonomous upstream pull request' "$SKILL" > "$tmp"
          if check_guard "$tmp" > /dev/null 2>&1; then
            echo "::error::negative test FAILED — guard passed after prohibition was removed"; rm -f "$tmp"; exit 1
          fi
          rm -f "$tmp"

          echo "Context-gating gate: OK (detection + edit/upstream-PR prohibition + #22 deferral present; negative test caught removal)."

      # 5c. GitHub-bound handle-escape gate (issue #48). The issue-body template
      #     the tech-lead emits to GitHub must never contain a bare team handle:
      #     the team handles collide with real GitHub usernames owned by
      #     strangers, and a bare mention in an issue body pings them. Handles
      #     inside backtick code spans are safe. Deterministic, zero token cost.
      - name: Issue-template handle-escape gate
        run: |
          SKILL=core/skills/tech-lead/SKILL.md

          check_template() {
            f="$1"
            test -f "$f" || { echo "::error::$f missing"; return 1; }
            # Extract the fenced block following the "## Issue body template"
            # header (```markdown ... ```).
            block="$(awk '/^## Issue body template/{hunt=1}
                          hunt && /^```markdown/{inb=1; next}
                          inb && /^```$/{exit}
                          inb{print}' "$f")"
            if [ -z "$block" ]; then
              echo "::error::$f: issue-body template block not found (header or fence renamed?)"
              return 1
            fi
            # Strip inline-code spans; any team handle that survives is bare.
            # `@<?` also catches the placeholder form @<dev|sre|...>.
            # `-i` because GitHub mentions are case-INsensitive: @Dev pings the
            # real user just like @dev would.
            bare="$(printf '%s\n' "$block" | sed 's/`[^`]*`//g' \
                    | grep -inE '@<?(dev|sre|design|sec|rev|research|techlead)\b' || true)"
            if [ -n "$bare" ]; then
              printf '%s\n' "$bare"
              echo "::error::$f: bare team handle in the issue-body template — backtick-escape it"
              return 1
            fi
            return 0
          }

          # POSITIVE: the shipped SKILL.md template must be clean.
          check_template "$SKILL" \
            || { echo "::error::tech-lead SKILL.md failed the handle-escape gate"; exit 1; }

          # NEGATIVE 1: a copy with the escaping stripped MUST fail, proving
          # the gate actually catches the regression it exists for.
          tmp="$(mktemp)"
          sed 's/`@<dev|sre|design|sec|rev|research>`/@<dev|sre|design|sec|rev|research>/' "$SKILL" > "$tmp"
          if check_template "$tmp" > /dev/null 2>&1; then
            echo "::error::negative test 1 FAILED — bare handle in template was NOT caught"
            rm -f "$tmp"; exit 1
          fi
          rm -f "$tmp"
          echo "negative test 1: stripped escape caught."

          # NEGATIVE 2: a MIXED-CASE bare handle (@Dev) MUST also fail — GitHub
          # mentions are case-insensitive, so the gate must be too (the `-i`
          # hardening from the `@sec` review of PR #49).
          tmp="$(mktemp)"
          sed 's/`@<dev|sre|design|sec|rev|research>`/@Dev/' "$SKILL" > "$tmp"
          if check_template "$tmp" > /dev/null 2>&1; then
            echo "::error::negative test 2 FAILED — mixed-case bare handle (@Dev) was NOT caught"
            rm -f "$tmp"; exit 1
          fi
          rm -f "$tmp"
          echo "negative test 2: mixed-case bare handle (@Dev) caught."

          echo "Handle-escape gate: OK (issue-body template has no bare team handles; negative tests caught a stripped escape and a mixed-case handle)."

      # 5d. Rule-origin governance gate (issue #68). Durable rules — the agent
      #     Non-negotiables, the tech-lead Principles, and the dispatch
      #     cost-discipline rules — live inside a
      #     `<!-- rules:origin-required --> … <!-- /rules:origin-required -->`
      #     fence and MUST each carry an `(origin: #NN · YYYY-MM-DD)` tag, so a
      #     rule's provenance is auditable and rules are superseded (not silently
      #     deleted). A stdlib-only scanner enforces it; an unclosed fence also
      #     fails. Deterministic, zero token cost.
      - name: Rule-origin governance gate
        run: |
          set -euo pipefail
          CHECK="core/scripts/check_rule_origin.py"
          FILES="core/skills/tech-lead/SKILL.md \
                 core/agents/engineer.md core/agents/sre.md core/agents/design.md \
                 core/agents/security.md core/agents/review.md core/agents/research.md"

          # POSITIVE: every shipped governed rule must carry an origin tag.
          # shellcheck disable=SC2086
          python3 "$CHECK" $FILES

          # NEGATIVE: a copy with one origin tag stripped MUST fail, proving the
          # gate catches the regression it exists for.
          tmp="$(mktemp --suffix=.md)"
          sed '0,/(origin: #[0-9][0-9]* · [0-9-][0-9-]*)/s/ *(origin: #[0-9][0-9]* · [0-9-][0-9-]*)//' \
            "core/agents/engineer.md" > "$tmp"
          if python3 "$CHECK" "$tmp" > /dev/null 2>&1; then
            echo "::error::negative test FAILED — gate passed after an origin tag was stripped"
            rm -f "$tmp"; exit 1
          fi
          rm -f "$tmp"
          echo "Rule-origin gate: OK (all governed rules tagged; negative test caught a stripped tag)."

      # 6. Installer script static checks.
      - name: shellcheck + bash -n install.sh
        run: |
          shellcheck install.sh
          bash -n install.sh

      # 6b. Outdated-version hooks: shellcheck-clean + >=7-day PostToolUse
      #     re-check gate (origin #52). outdated-check.sh (SessionStart) and
      #     outdated-recheck.sh (PostToolUse) share hooks/lib/version-check.sh
      #     so the semver-compare logic lives in exactly one place. Proves,
      #     with a stubbed curl (no real network), that the re-check hook
      #     SUPPRESSES within the 7-day window and FIRES once the persisted
      #     timestamp is >=7 days old, and that it never nudges on a
      #     patch-only bump (anti-nag).
      - name: outdated-version hooks — shellcheck + >=7-day gate test
        run: |
          set -e
          HOOKS_DIR="harnesses/claude-code/marc/hooks"
          shellcheck "$HOOKS_DIR/outdated-check.sh" "$HOOKS_DIR/outdated-recheck.sh" "$HOOKS_DIR/lib/version-check.sh"
          bash -n "$HOOKS_DIR/outdated-check.sh"
          bash -n "$HOOKS_DIR/outdated-recheck.sh"
          bash -n "$HOOKS_DIR/lib/version-check.sh"

          WORK="$(mktemp -d)"
          mkdir -p "$WORK/plugin/.claude-plugin" "$WORK/state" "$WORK/fakebin"
          echo '{"name":"marc","version":"1.0.0"}' > "$WORK/plugin/.claude-plugin/plugin.json"

          printf '%s\n' '#!/usr/bin/env bash' 'echo "call" >> "$MARC_TEST_CURL_LOG"' 'echo '"'"'{"version":"1.1.0"}'"'"'' > "$WORK/fakebin/curl"
          chmod +x "$WORK/fakebin/curl"

          export CLAUDE_PLUGIN_ROOT="$WORK/plugin"
          export MARC_STATE_DIR="$WORK/state"
          export MARC_TEST_CURL_LOG="$WORK/curl.log"
          export PATH="$WORK/fakebin:$PATH"
          : > "$MARC_TEST_CURL_LOG"

          RECHECK="$HOOKS_DIR/outdated-recheck.sh"

          # No stamp yet -> gate is due -> must fire (nudge + 1 network call).
          out1="$(bash "$RECHECK")"
          calls1="$(wc -l < "$MARC_TEST_CURL_LOG")"
          echo "$out1" | grep -q "update available: 1.0.0 -> 1.1.0" || { echo "::error::expected nudge on first (no-stamp) run"; exit 1; }
          [ "$calls1" -eq 1 ] || { echo "::error::expected exactly 1 network call on first run, got $calls1"; exit 1; }

          # Fresh stamp (just written) -> within 7 days -> must SUPPRESS, zero extra network calls.
          out2="$(bash "$RECHECK")"
          calls2="$(wc -l < "$MARC_TEST_CURL_LOG")"
          [ -z "$out2" ] || { echo "::error::expected silent suppress within 7-day window, got: $out2"; exit 1; }
          [ "$calls2" -eq 1 ] || { echo "::error::expected no additional network call within 7-day window, call count now $calls2"; exit 1; }

          # Inject a timestamp >=7 days old -> gate must be due again -> FIRES.
          eight_days_ago=$(( $(date +%s) - 8*24*3600 ))
          echo "$eight_days_ago" > "$MARC_STATE_DIR/outdated-check-last-run"
          out3="$(bash "$RECHECK")"
          calls3="$(wc -l < "$MARC_TEST_CURL_LOG")"
          echo "$out3" | grep -q "update available: 1.0.0 -> 1.1.0" || { echo "::error::expected nudge after >=7-day-old stamp"; exit 1; }
          [ "$calls3" -eq 2 ] || { echo "::error::expected a second network call after the gate re-elapsed, got $calls3"; exit 1; }
          new_stamp="$(cat "$MARC_STATE_DIR/outdated-check-last-run")"
          now="$(date +%s)"
          [ $(( now - new_stamp )) -lt 60 ] || { echo "::error::expected the stamp to be refreshed to ~now after firing"; exit 1; }

          # Patch-only drift (anti-nag): same major.minor, different patch -> must stay silent.
          printf '%s\n' '#!/usr/bin/env bash' 'echo '"'"'{"version":"1.0.9"}'"'"'' > "$WORK/fakebin/curl"
          chmod +x "$WORK/fakebin/curl"
          rm -f "$MARC_STATE_DIR/outdated-check-last-run"
          out4="$(bash "$RECHECK")"
          [ -z "$out4" ] || { echo "::error::patch-only drift must not nudge (anti-nag), got: $out4"; exit 1; }

          echo "outdated-version hooks: OK (shellcheck-clean; 7-day gate suppresses+fires; anti-nag holds)."

      # 6c. Compaction-triggered operating-invariants card (origin #41, #145):
      #     SessionStart hook gated (via hooks.json matcher AND an in-script
      #     defensive re-check) to source=compact only. Proves the card IS
      #     emitted on the compact path, is NOT emitted on a normal/other
      #     SessionStart source, and that a missing card file degrades to a
      #     silent exit 0 (warn-only contract, same posture as the other
      #     hooks in this directory).
      - name: invariants-card hook — shellcheck + compact-only emission test
        run: |
          set -e
          HOOKS_DIR="harnesses/claude-code/marc/hooks"
          CARD="harnesses/claude-code/marc/skills/tech-lead/references/invariants-card.md"
          shellcheck "$HOOKS_DIR/invariants-card.sh"
          bash -n "$HOOKS_DIR/invariants-card.sh"
          [ -f "$CARD" ] || { echo "::error::invariants-card.md missing"; exit 1; }

          HOOK="$HOOKS_DIR/invariants-card.sh"

          # source=compact -> must emit the card content.
          out_compact="$(printf '{"source":"compact"}' | bash "$HOOK")"
          [ -n "$out_compact" ] || { echo "::error::expected card output on source=compact"; exit 1; }
          echo "$out_compact" | grep -q "operating invariants" || { echo "::error::compact output missing expected card heading"; exit 1; }

          # source=startup (ordinary SessionStart) -> must stay silent.
          out_startup="$(printf '{"source":"startup"}' | bash "$HOOK")"
          [ -z "$out_startup" ] || { echo "::error::expected silence on source=startup, got: $out_startup"; exit 1; }

          # source=resume -> must stay silent too.
          out_resume="$(printf '{"source":"resume"}' | bash "$HOOK")"
          [ -z "$out_resume" ] || { echo "::error::expected silence on source=resume, got: $out_resume"; exit 1; }

          # Missing card file -> silent exit 0, even on source=compact.
          out_missing="$(printf '{"source":"compact"}' | MARC_INVARIANTS_CARD="/tmp/marc-invariants-does-not-exist-$$.md" bash "$HOOK")"
          status_missing=$?
          [ -z "$out_missing" ] || { echo "::error::expected silence when card file is missing, got: $out_missing"; exit 1; }
          [ "$status_missing" -eq 0 ] || { echo "::error::expected exit 0 when card file is missing, got $status_missing"; exit 1; }

          echo "invariants-card hook: OK (shellcheck-clean; emits on compact only; silent on missing card)."

      # 7. Wordmark parity gate: the block-letter "mARC" wordmark is a copy-paste
      #    duplicate across three surfaces (README banner, install.sh banner,
      #    docs/index.html hero). They MUST stay byte-identical so the brand mark
      #    never drifts. (Decision on issue #11, REVISED 2026-07-04 by maintainer:
      #    the leading glyph is now a bespoke lowercase x-height "m" (Candidate A)
      #    rendered in the ANSI Shadow idiom (█ fills + ╗║╚═╝ edges) beside the
      #    full-height "ARC" — m-width 11, total 38 cols, all unchanged from the
      #    old cap-M. This REVERSES the earlier keep-uppercase call: a design pass
      #    showed the x-height "m" stays on-grid and preserves the shadow style
      #    without breaking it. Brand case "mARC" is still reinforced by the
      #    aria-label + all prose/taglines.)
      - name: Wordmark parity gate
        run: |
          python3 - <<'PY'
          import sys
          FILES = ["README.md", "install.sh", "docs/index.html"]
          def block(path):
              lines = open(path, encoding="utf-8").read().split("\n")
              # first row of the block is the "A" apex "█████╗": the leading
              # lowercase "m" is blank on its top two rows, so the block's row 0
              # is the ARC apex (the old cap-M top "███╗" no longer exists).
              start = next(i for i, l in enumerate(lines) if l.lstrip().startswith("█████╗"))
              # normalise trailing whitespace only: rows 3-4 legitimately shorter (C is open on the right)
              return [l.rstrip() for l in lines[start:start + 6]]
          ref = block(FILES[0])
          bad = False
          for f in FILES:
              b = block(f)
              if b != ref:
                  print(f"FAIL {f}: wordmark block differs from {FILES[0]}")
                  for r, (x, y) in enumerate(zip(ref, b)):
                      if x != y:
                          print(f"  row{r+1}: {FILES[0]!r}={x!r}  {f!r}={y!r}")
                  bad = True
              else:
                  print(f"ok   {f}")
          if bad:
              print("\nWordmark parity gate: FAILED — the three wordmark surfaces have drifted.")
              sys.exit(1)
          print("\nWordmark parity gate: all three surfaces carry an identical 6-row block wordmark.")
          PY

      # 8. CHANGELOG parity gate (issue #26): the shipped plugin version and the
      #    CHANGELOG must never drift. Fail if `plugin.json` `.version` has no
      #    matching `## [X.Y.Z]` section in CHANGELOG.md. This is the regression
      #    guard for the release surface — a version bump that forgets its
      #    CHANGELOG section (and therefore its Release body) is caught here on
      #    the PR, before a tag is ever cut. Deterministic, zero token cost.
      - name: CHANGELOG parity gate
        run: |
          PLUGIN=harnesses/claude-code/marc/.claude-plugin/plugin.json
          CHANGELOG=CHANGELOG.md
          # Reusable assertion: version $1 has a `## [$1]` section in $2.
          check_parity() {
            v="$1"; f="$2"
            test -f "$f" || { echo "::error::$f missing"; return 1; }
            # Anchor on the exact section header; the `[` is a literal, so escape
            # it in the regex. Keep-a-Changelog header is `## [X.Y.Z] - date`.
            grep -qE "^## \[${v}\]" "$f" \
              || { echo "::error::$f has no '## [${v}]' section for plugin version ${v}"; return 1; }
            return 0
          }

          VERSION="$(jq -r .version "$PLUGIN")"
          test -n "$VERSION" && test "$VERSION" != "null" \
            || { echo "::error::could not read .version from $PLUGIN"; exit 1; }

          # POSITIVE: the shipped version must have its CHANGELOG section.
          check_parity "$VERSION" "$CHANGELOG" \
            || { echo "::error::CHANGELOG parity gate: plugin.json version ${VERSION} has no matching CHANGELOG section"; exit 1; }

          # NEGATIVE: a version that is deliberately NOT in the CHANGELOG MUST
          # fail, proving the gate actually catches drift.
          if check_parity "9.9.9-nonexistent" "$CHANGELOG" > /dev/null 2>&1; then
            echo "::error::negative test FAILED — parity gate passed for a version with no CHANGELOG section"; exit 1
          fi

          echo "CHANGELOG parity gate: OK (plugin.json ${VERSION} has a '## [${VERSION}]' section; negative test rejected a missing version)."

      # 8a. Harness version-parity gate: the Claude Code and Google Antigravity
      #     manifests ship in lockstep (same version each release), so fail if
      #     their `.version` fields ever drift apart. Deterministic, zero token
      #     cost, mirrors the CHANGELOG parity gate above.
      - name: Harness version-parity gate
        run: |
          CC_PLUGIN=harnesses/claude-code/marc/.claude-plugin/plugin.json
          AGY_PLUGIN=harnesses/antigravity/marc/plugin.json
          COPILOT_PLUGIN=harnesses/copilot/marc/plugin.json

          CC_VERSION="$(jq -r .version "$CC_PLUGIN")"
          AGY_VERSION="$(jq -r .version "$AGY_PLUGIN")"
          COPILOT_VERSION="$(jq -r .version "$COPILOT_PLUGIN")"

          test -n "$CC_VERSION" && test "$CC_VERSION" != "null" \
            || { echo "::error::could not read .version from $CC_PLUGIN"; exit 1; }
          test -n "$AGY_VERSION" && test "$AGY_VERSION" != "null" \
            || { echo "::error::could not read .version from $AGY_PLUGIN"; exit 1; }
          test -n "$COPILOT_VERSION" && test "$COPILOT_VERSION" != "null" \
            || { echo "::error::could not read .version from $COPILOT_PLUGIN"; exit 1; }

          if [ "$CC_VERSION" != "$AGY_VERSION" ]; then
            echo "::error::Harness version-parity gate: $CC_PLUGIN is ${CC_VERSION} but $AGY_PLUGIN is ${AGY_VERSION}, both harnesses must ship at the same version."
            exit 1
          fi

          if [ "$CC_VERSION" != "$COPILOT_VERSION" ]; then
            echo "::error::Harness version-parity gate: $CC_PLUGIN is ${CC_VERSION} but $COPILOT_PLUGIN is ${COPILOT_VERSION}, all harnesses must ship at the same version."
            exit 1
          fi

          echo "Harness version-parity gate: OK (claude-code, antigravity, and copilot harnesses at ${CC_VERSION})."

      # 9. actionlint — workflow schema + expression lint. Plain YAML parsing
      #    (jq/yaml.safe_load) accepts a file that GitHub's stricter workflow
      #    schema rejects at load time (a "startup_failure": no jobs ever run).
      #    release.yml regressed exactly this way — an empty `${{ }}` expression
      #    inside a run: block is valid YAML but an invalid Actions expression.
      #    This gate catches that class of bug on the PR. Pinned + checksum-
      #    verified (no curl|bash, no unpinned third-party action).
      # 8b. Token-guard hook self-test (issue #71). The warn-only PostToolUse
      #     runaway-loop guard shares ONE counting implementation with the manual
      #     sentinel (#69); this stdlib-only test synthesizes fake transcript
      #     fixtures (no real paths/names/session ids) and asserts the advisory
      #     fires once past the Opus threshold, is debounced within a band and
      #     re-arms at 2N, never fires below threshold or for Sonnet-only turns,
      #     emits a NON-BLOCKING payload (no `decision`), and ALWAYS exits 0.
      #     Deterministic, offline, zero token cost.
      - name: token-guard hook self-test
        run: python3 core/scripts/test_token_sentinel.py

      # 8b-tel. Opt-in token-telemetry recorder (issue #149): shellcheck +
      #     bash -n on the new Stop hook, then a stdlib-only Python self-test
      #     that exercises the REAL hook script end-to-end via synthetic
      #     team.toml/transcript fixtures (no real paths/names/session ids):
      #     OFF by default (no team.toml, or `enabled = false`) writes NO
      #     file; `enabled = true` writes exactly one well-formed JSONL line
      #     per Stop firing with the whitelisted numeric-only schema (no
      #     message-body field ever leaks); a missing transcript still exits
      #     0 with no write. Deterministic, offline, zero token cost.
      - name: token-telemetry hook — shellcheck + on/off self-test
        run: |
          shellcheck harnesses/claude-code/marc/hooks/token-telemetry.sh
          bash -n harnesses/claude-code/marc/hooks/token-telemetry.sh
          python3 core/scripts/test_token_telemetry.py

      # 8b-tel2. Backfill idempotency (issue #149 AC#5): a stdlib-only test
      #     synthesizes a fake `~/.claude/projects/**/*.jsonl` tree and
      #     asserts the one-shot backfill writes one record per turn on a
      #     first run, is IDEMPOTENT on a re-run against the same
      #     transcripts (keyed on session_id+turn_index), still picks up
      #     genuinely new turns/sessions, and `--dry-run` writes nothing.
      - name: token-telemetry-backfill idempotency self-test
        run: python3 core/scripts/test_token_telemetry_backfill.py

      # 8c. board_reconcile.py digest contract self-test (issue #103, extended
      #     #105 set-status, #113 create). Internal operator CLI, no E2E flow
      #     to assert on — instead this feeds `GitHubProvider` canned fixture
      #     data (via its injectable `run` callable, no real `gh`/`git`/
      #     network) and asserts the normalized `--json` digest keeps its
      #     exact schema (so a future provider or accidental field rename
      #     can't silently drift it), that `set-status` fails loudly on an
      #     unresolvable board, and that `create` never loses a created issue
      #     even when the board-add or status-set step fails. Deterministic,
      #     offline, zero token cost.
      - name: board_reconcile digest contract self-test
        run: python3 core/scripts/test_board_reconcile.py

      # 8d. Cross-harness script-parity self-test (issue #107). A harness's
      #     compiled SKILL.md can instruct the operator to run
      #     `${SOME_PLUGIN_ROOT}/scripts/<name>.py` while that harness ships
      #     no `scripts/` directory at all (Antigravity referenced
      #     `board_reconcile.py`/`token_sentinel.py` with no `scripts/`
      #     symlink, breaking board reconcile + set-status there). This scans
      #     every harness's compiled SKILL.md files for
      #     `${<PLUGIN_ROOT_ENV>:-.}/scripts/<name>` references and asserts
      #     each resolves to a real file within that harness. Deterministic,
      #     offline, zero token cost.
      - name: cross-harness script-parity self-test
        run: python3 core/scripts/test_script_parity.py

      # 8d-2. Cross-harness hooks-parity self-test (issue #173, #170). Same
      #       shape as the script-parity gate above, but for hooks.json: every
      #       harness's compiled hooks/hooks.json must match what
      #       core/hooks/hooks.spec.json compiles to (drift), every referenced
      #       hook .sh must exist under that harness's own hooks/ (existence),
      #       and no harness's hooks/ may be a symlink (the #170 defect
      #       shape). Deterministic, offline, zero token cost.
      - name: cross-harness hooks-parity self-test
        run: python3 core/scripts/test_hooks_parity.py

      # 8e. release_gate.py self-test (issue #75). Feeds the pure
      #     `is_released()` decision synthetic tag/release lists (no `gh`/
      #     `git`/network) and asserts released-ok/missing-tag/no-release/
      #     draft-release verdicts, so the scheduled release-gate.yml check
      #     (which invokes this same function against real repo state) is
      #     backed by deterministic, offline, zero-token-cost coverage.
      - name: release-gate self-test
        run: python3 core/scripts/test_release_gate.py

      # 8f. release_verify.py self-test (issue #113). Feeds the pure
      #     `verify_release()` decision synthetic tag/workflow-run/release
      #     fixtures (no `gh`/`git`/network) and asserts the per-check
      #     PASS/FAIL verdict — tag_exists, workflow_run (missing/running/
      #     failed), release_published (missing/draft/not-Latest) — so the
      #     operator's on-demand post-release digest is backed by
      #     deterministic, offline, zero-token-cost coverage, same pattern as
      #     `release_gate.py`/`test_release_gate.py`.
      - name: release-verify self-test
        run: python3 core/scripts/test_release_verify.py

      - name: actionlint (workflow schema + expression lint)
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSLo "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "$tarball" actionlint
          # Lint every workflow under .github/workflows/ for GitHub's workflow
          # SCHEMA + EXPRESSION validity (the startup_failure class). We disable
          # actionlint's embedded shellcheck/pyflakes integrations (-shellcheck=
          # / -pyflakes=): those impose shell/python STYLE on run: scripts (e.g.
          # SC2015 on the intentional `check … || { echo; exit 1; }` pattern used
          # throughout this file) and are out of scope here — install.sh already
          # has a dedicated shellcheck step. Expression checks (e.g. an empty
          # Actions expression) are unaffected and still fail the gate.
          ./actionlint -color -shellcheck= -pyflakes=

  # ---------------------------------------------------------------------------
  # Tier 2 — install + cross-repo. Prefer no-auth. Uses an isolated,
  # workspace-local CLAUDE_CONFIG_DIR so nothing leaks between steps/runners.
  # ---------------------------------------------------------------------------
  install:
    name: Tier 2 — install + cross-repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI (pinned)
        run: |
          npm i -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude --version

      # 9. Empirically determine the auth boundary, IN the runner, and record it
      #    in the job log. This is the actual proof behind "no secret needed".
      #    Runs with ANTHROPIC_API_KEY explicitly unset. If any step here failed
      #    for lack of auth, the job would go red and we'd fall back per issue #5.
      - name: Empirical auth-boundary probe (no ANTHROPIC_API_KEY)
        env:
          ANTHROPIC_API_KEY: ""
          CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.marc-probe
        run: |
          set -x
          mkdir -p "$CLAUDE_CONFIG_DIR"
          # These three are the whole Tier-2 chain; if install needed a key it
          # would fail here with the key unset.
          claude plugin marketplace add ./
          claude plugin install marc@nexaduo
          claude plugin list --json | jq -e '.[] | select(.id=="marc@nexaduo")' > /dev/null
          echo "AUTH-BOUNDARY: plugin install SUCCEEDED with no ANTHROPIC_API_KEY."

      # 7. In-repo registration proof (fresh config dir).
      #    `list --json` exposes the installed plugin; the per-plugin component
      #    inventory (skills/agents) is exposed by `plugin details`, so we assert
      #    the plugin via `list --json | jq -e` and the skill+agents via
      #    `details` output.
      - name: Tier 2 — in-repo registration
        env:
          ANTHROPIC_API_KEY: ""
          CLAUDE_CONFIG_DIR: ${{ github.workspace }}/.marc-inrepo
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add ./
          claude plugin install marc@nexaduo

          echo "== assert plugin marc@nexaduo installed (list --json | jq -e) =="
          claude plugin list --json | jq -e '.[] | select(.id=="marc@nexaduo" and .enabled==true)' > /dev/null

          echo "== assert skill + agents registered (plugin details) =="
          DETAILS="$(claude plugin details marc@nexaduo)"
          echo "$DETAILS"
          for component in tech-lead engineer sre design security review research; do
            echo "$DETAILS" | grep -qiw "$component" \
              || { echo "::error::component '$component' not registered in plugin details"; exit 1; }
          done
          echo "In-repo: plugin + tech-lead skill + engineer/sre/design/security/research agents all registered."

          # 10. Bundled-script + hook resolution against the INSTALLED copy
          #     (issue #167 AC#1/AC#2). Everything above proves the plugin is
          #     *registered*; it never proves a script referenced from a
          #     compiled SKILL.md, or a hook script referenced from
          #     hooks.json, actually resolves once installed. Resolve
          #     `${CLAUDE_PLUGIN_ROOT}` the same way the CLI does at runtime:
          #     via `plugin list --json`'s `installPath` field, which is the
          #     real on-disk cache location (verified empirically:
          #     $CLAUDE_CONFIG_DIR/plugins/cache/nexaduo/marc/<version>).
          INSTALL_PATH="$(claude plugin list --json | jq -r '.[] | select(.id=="marc@nexaduo") | .installPath')"
          test -n "$INSTALL_PATH" && test -d "$INSTALL_PATH" \
            || { echo "::error::could not resolve installPath for marc@nexaduo from 'plugin list --json'"; exit 1; }
          echo "Installed copy resolved at: $INSTALL_PATH"

          echo "== assert bundled scripts resolve via \${CLAUDE_PLUGIN_ROOT} against the INSTALLED copy =="
          SCRIPT_REFS="$(grep -rhoE '\$\{CLAUDE_PLUGIN_ROOT:-\.\}/scripts/[A-Za-z0-9_.-]+' "$INSTALL_PATH"/skills/*/SKILL.md | sed -E 's#.*/scripts/##' | sort -u)"
          test -n "$SCRIPT_REFS" || { echo "::error::no \${CLAUDE_PLUGIN_ROOT}/scripts/* references found in installed SKILL.md files"; exit 1; }
          while IFS= read -r name; do
            resolved="$INSTALL_PATH/scripts/$name"
            test -f "$resolved" || { echo "::error::installed script '$name' referenced from SKILL.md is missing at $resolved"; exit 1; }
            python3 "$resolved" --help > /dev/null \
              || { echo "::error::installed script '$name' at $resolved is not executable via python3 (--help failed)"; exit 1; }
            echo "OK: \${CLAUDE_PLUGIN_ROOT}/scripts/$name resolves and runs from the installed copy ($resolved)"
          done <<< "$SCRIPT_REFS"

          echo "== assert hooks resolve via \${CLAUDE_PLUGIN_ROOT} against the INSTALLED copy =="
          HOOKS_JSON="$INSTALL_PATH/hooks/hooks.json"
          test -f "$HOOKS_JSON" || { echo "::error::installed hooks.json missing at $HOOKS_JSON"; exit 1; }
          jq -e . "$HOOKS_JSON" > /dev/null || { echo "::error::installed hooks.json at $HOOKS_JSON is not valid JSON"; exit 1; }
          HOOK_REFS="$(grep -oE '\$\{CLAUDE_PLUGIN_ROOT\}/hooks/[A-Za-z0-9_.-]+' "$HOOKS_JSON" | sed -E 's#.*/hooks/##' | sort -u)"
          test -n "$HOOK_REFS" || { echo "::error::no \${CLAUDE_PLUGIN_ROOT}/hooks/* references found in installed hooks.json"; exit 1; }
          while IFS= read -r name; do
            resolved="$INSTALL_PATH/hooks/$name"
            test -f "$resolved" || { echo "::error::installed hook script '$name' referenced from hooks.json is missing at $resolved"; exit 1; }
            bash -n "$resolved" || { echo "::error::installed hook script '$name' at $resolved fails bash syntax check"; exit 1; }
            echo "OK: \${CLAUDE_PLUGIN_ROOT}/hooks/$name resolves and parses from the installed copy ($resolved)"
          done <<< "$HOOK_REFS"

          echo "NOTE: this proves hook/script *resolution* (file present, syntactically valid,"
          echo "and for scripts, runnable via python3 --help) against the real installed copy."
          echo "It does NOT prove a hook actually *fires* end-to-end through Claude Code's own"
          echo "SessionStart/PostToolUse/Stop dispatch — no Tier 1/2 step anywhere exercises that;"
          echo "the hook-logic self-tests below (search this log for 'invariants-card'/'outdated')"
          echo "cover the scripts' own behavior standalone, with CLAUDE_PLUGIN_ROOT set by hand."

      # Trusted-context gate (issue #167 AC#3): GitHub Actions never exposes
      # secrets to `pull_request` runs from forks, so a fork PR genuinely
      # cannot run this step — that is an honest, visible SKIP via `if:`, not
      # a silent pass. On a trusted context (push, or a same-repo PR) the
      # secret is expected to exist; if it's missing THERE, that's a real
      # regression (rotation/expiry/misconfig), and the step below hard-fails
      # instead of exiting 0 — coverage that didn't run must never read as
      # green. See the "Antigravity coverage status" step further down for
      # the fork-skip case, which is also made explicit rather than silent.
      - name: Tier 2 — Antigravity harness install + component registration
        id: antigravity_install
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY }}
          HOME: ${{ github.workspace }}/.agy-home
        run: |
          set -euo pipefail
          if [ -z "${ANTIGRAVITY_API_KEY:-}" ]; then
            {
              echo "### :x: Antigravity Tier 2 coverage NOT RUN"
              echo "ANTIGRAVITY_API_KEY is absent on a trusted context (push, or a same-repo PR)."
              echo "No Antigravity install/component/script/hooks assertions ran in this build."
              echo "This is a real regression (secret missing/rotated/expired), not an expected skip."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::ANTIGRAVITY_API_KEY is absent on a trusted context. Failing loudly instead of skipping silently — absent coverage must never read as a pass."
            exit 1
          fi

          echo "Installing Google Antigravity CLI..."
          pip3 install --break-system-packages google-antigravity==0.1.6

          echo "Bootstrapping Antigravity CLI binary..."
          curl -sSL https://antigravity.google/cli/install.sh | bash

          export PATH="$HOME/.local/bin:$PATH"

          echo "Installing mARC plugin..."
          agy plugin install harnesses/antigravity/marc

          echo "Asserting plugin registration..."
          agy plugin list | jq -e '.imports[] | select(.name=="marc")' > /dev/null

          echo "Asserting all seven components are registered..."
          CONFIG_DIR="$HOME/.gemini/config/plugins/marc"

          # Assert specialist agents
          for component in engineer sre design security review research; do
            test -f "$CONFIG_DIR/agents/$component.md" || {
              echo "::error::Agent component '$component' not found in config directory"
              exit 1
            }
          done

          # Assert tech-lead skill
          test -f "$CONFIG_DIR/skills/tech-lead/SKILL.md" || {
            echo "::error::Skill component 'tech-lead' not found in config directory"
            exit 1
          }

          # Bundled-script resolution against the INSTALLED copy (issue #167
          # AC#1). Antigravity's plugin-root equivalent is AGY_PLUGIN_ROOT
          # (compile.json); the installed on-disk equivalent is CONFIG_DIR
          # above (verified: `agy plugin install` places the plugin at
          # $HOME/.gemini/config/plugins/marc, mirroring Claude Code's cache
          # layout).
          echo "== assert bundled scripts resolve via \${AGY_PLUGIN_ROOT} against the INSTALLED copy =="
          SCRIPT_REFS="$(grep -rhoE '\$\{AGY_PLUGIN_ROOT:-\.\}/scripts/[A-Za-z0-9_.-]+' "$CONFIG_DIR"/skills/*/SKILL.md | sed -E 's#.*/scripts/##' | sort -u)"
          test -n "$SCRIPT_REFS" || { echo "::error::no \${AGY_PLUGIN_ROOT}/scripts/* references found in installed SKILL.md files"; exit 1; }
          while IFS= read -r name; do
            resolved="$CONFIG_DIR/scripts/$name"
            test -f "$resolved" || { echo "::error::installed script '$name' referenced from SKILL.md is missing at $resolved"; exit 1; }
            python3 "$resolved" --help > /dev/null \
              || { echo "::error::installed script '$name' at $resolved is not executable via python3 (--help failed)"; exit 1; }
            echo "OK: \${AGY_PLUGIN_ROOT}/scripts/$name resolves and runs from the installed copy ($resolved)"
          done <<< "$SCRIPT_REFS"

          echo "Antigravity harness check: OK (plugin installed, all seven components registered, bundled scripts resolve against the installed copy). Hooks are asserted in the next step."

      # Hooks (issue #167 AC#2, fixed by #173/#170). harnesses/antigravity/marc/
      # hooks is now a real, compiled directory (scripts/compile_prompts.py,
      # from core/hooks/hooks.spec.json) — no longer the bare symlink to the
      # Claude Code harness's hooks/ introduced in PR #80. This step asserts
      # against the INSTALLED copy, using Antigravity's own declared vars
      # (compile.json: project_dir_env=AGY_PROJECT_DIR,
      # plugin_root_env=AGY_PLUGIN_ROOT) and its own confirmed-compatible
      # trigger name (COMPATIBILITY.md: SessionStart), rather than assuming
      # parity with Claude Code.
      #
      # `continue-on-error` REMOVED (#170 AC#3): this assertion previously
      # went red because the shared hooks.json hardcoded Claude Code's
      # CLAUDE_PLUGIN_ROOT with no fallback in every one of its five hook
      # commands. #173/#170 fixed that at the source (core/hooks/
      # hooks.spec.json renders each harness's own plugin_root_env), so this
      # assertion is now load-bearing like every other Tier 2 step.
      - name: Tier 2 — Antigravity hook-resolution assertion (issue #167 AC#2, #170)
        id: antigravity_hooks
        if: steps.antigravity_install.outcome == 'success'
        env:
          HOME: ${{ github.workspace }}/.agy-home
        run: |
          set -euo pipefail
          CONFIG_DIR="$HOME/.gemini/config/plugins/marc"
          HOOKS_JSON="$CONFIG_DIR/hooks/hooks.json"

          echo "== assert the installed copy actually carries hooks/ (not N/A — COMPATIBILITY.md documents hooks as Highly Compatible) =="
          test -d "$CONFIG_DIR/hooks" || { echo "::error::installed copy has no hooks/ directory — if hooks were genuinely removed from the harness, replace this assertion; do not silently drop coverage"; exit 1; }
          test -f "$HOOKS_JSON" || { echo "::error::hooks/ exists but hooks.json is missing at $HOOKS_JSON"; exit 1; }

          echo "== assert hooks.json declares Antigravity's own confirmed-compatible trigger name =="
          jq -e '.hooks.SessionStart' "$HOOKS_JSON" > /dev/null || { echo "::error::installed hooks.json has no .hooks.SessionStart entry — COMPATIBILITY.md documents SessionStart as a trigger name Antigravity itself supports"; exit 1; }

          echo "== assert every hook command's referenced script resolves to a real file UNDER ANTIGRAVITY'S OWN DECLARED ENV VARS (AGY_PLUGIN_ROOT / AGY_PROJECT_DIR per compile.json) — not Claude Code's =="

          # Match quoted ${VAR...}/path references ending in ".sh" specifically
          # — i.e. the actual hook-script invocation each command makes. This
          # deliberately does NOT match the team.toml/team.config config-path
          # lookups some commands also embed (that discovery path is #166's
          # contested territory, out of scope here); anchoring on ".sh" keeps
          # this assertion scoped to "does the hook's own script resolve". Not
          # every hook command invokes an external script (one SessionStart
          # entry is pure inline shell with no .sh reference) — that is a
          # legitimate case, not a failure, so it is only counted, not flagged.
          fail=0
          total_refs=0
          while IFS= read -r -d '' cmd; do
            [ -z "$cmd" ] && continue
            refs="$(grep -oE '"\$\{[A-Z_]+(:-[^}]*)?\}[^"]*\.sh"' <<< "$cmd")" || true
            [ -z "$refs" ] && continue
            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              total_refs=$((total_refs + 1))
              path_expr="${ref#\"}"
              path_expr="${path_expr%\"}"

              # Resolve WITHOUT ever invoking a shell on file-derived content
              # (no `bash -c`/eval). A crafted hooks.json command could embed
              # shell metacharacters in this expression; refuse those outright
              # rather than let them reach any interpreter. Only the two
              # variables Antigravity itself declares (compile.json:
              # plugin_root_env=AGY_PLUGIN_ROOT, project_dir_env=
              # AGY_PROJECT_DIR) are substituted with real values — anything
              # else (including CLAUDE_PLUGIN_ROOT/CLAUDE_PROJECT_DIR, which is
              # exactly what the real hardcoded hooks.json uses) is an
              # unexpected variable and is reported as a finding, not silently
              # resolved.
              case "$path_expr" in
                *'$('*|*'`'*|*';'*|*'|'*|*'&'*|*$'\n'*|*'>'*|*'<'*)
                  echo "::error::hook script reference contains shell metacharacters and will not be evaluated — '$path_expr' (from command: $cmd) is refused outright rather than resolved, since injecting shell syntax into a hook-script path reference is itself a security finding"
                  fail=1
                  continue
                  ;;
              esac

              if [[ "$path_expr" =~ ^\$\{([A-Z_]+)(:-([^}]*))?\}(.*)$ ]]; then
                var_name="${BASH_REMATCH[1]}"
                var_default="${BASH_REMATCH[3]}"
                path_rest="${BASH_REMATCH[4]}"
                case "$var_name" in
                  AGY_PLUGIN_ROOT) var_value="$CONFIG_DIR" ;;
                  AGY_PROJECT_DIR) var_value="$PWD" ;;
                  *)
                    echo "::error::hook script reference does NOT resolve under Antigravity's own declared env vars — '$path_expr' (from command: $cmd) references '\$$var_name', which Antigravity's compile.json does not declare (only AGY_PLUGIN_ROOT/AGY_PROJECT_DIR are expected). Antigravity does not set Claude-Code-only variables, so this reference cannot resolve at runtime. This is the tracked product defect: hooks/hooks.json (shared via the PR #80 symlink) still hardcodes CLAUDE_PLUGIN_ROOT with no fallback; COMPATIBILITY.md's own 'Action Needed' column says this env-var adaptation was required but it was never applied."
                    fail=1
                    continue
                    ;;
                esac
                resolved="${var_value}${path_rest}"
              else
                echo "::error::hook script reference '$path_expr' (from command: $cmd) does not match the expected \${VAR}/path.sh or \${VAR:-default}/path.sh form — refusing to resolve"
                fail=1
                continue
              fi

              if [ -f "$resolved" ]; then
                echo "OK: '$path_expr' (from command: $cmd) resolves to a real file ($resolved) under Antigravity's own env vars"
              else
                echo "::error::hook script reference does NOT resolve under Antigravity's own declared env vars — '$path_expr' (from command: $cmd) expands to '$resolved' (not a real file) when only AGY_PLUGIN_ROOT/AGY_PROJECT_DIR are set and no CLAUDE_PLUGIN_ROOT/CLAUDE_PROJECT_DIR are present (Antigravity does not set Claude-Code-only variables). This is the tracked product defect: hooks/hooks.json (shared via the PR #80 symlink) still hardcodes CLAUDE_PLUGIN_ROOT with no fallback; COMPATIBILITY.md's own 'Action Needed' column says this env-var adaptation was required but it was never applied."
                fail=1
              fi
            done <<< "$refs"
          done < <(jq --raw-output0 '.. | .command? // empty' "$HOOKS_JSON")

          test "$total_refs" -gt 0 || { echo "::error::found no \${VAR}/path.sh hook-script references anywhere in installed hooks.json — this assertion would be vacuous"; exit 1; }
          echo "Checked $total_refs hook-script reference(s)."

          if [ "$fail" -ne 0 ]; then
            echo "::error::Antigravity hook-resolution assertion FAILED. This step has no continue-on-error (removed, #170 AC#3) — it is load-bearing and fails the job. This is a real regression in harnesses/antigravity/marc + harnesses/claude-code/marc/hooks, not a test bug — do not weaken this assertion to force a pass."
            exit 1
          fi
          echo "Antigravity hook-resolution check: all hook commands resolve to real files under Antigravity's own declared env vars."

      # Always-visible status for the Antigravity step above, regardless of
      # whether it ran, was skipped (fork PR — expected, honest SKIP), or
      # failed (secret missing on a trusted context — real regression). This
      # guarantees the fork-PR case is never mistaken for "ran and passed"
      # just because the job stayed green.
      - name: Antigravity coverage status (always visible)
        if: always()
        run: |
          case "${{ steps.antigravity_install.outcome }}" in
            success) echo "Antigravity Tier 2 coverage: RAN and PASSED." ;;
            skipped) {
                echo "### :large_yellow_circle: Antigravity Tier 2 coverage: SKIPPED (fork PR)"
                echo "This run is a pull_request from a fork, so ANTIGRAVITY_API_KEY is not available (GitHub Actions never exposes secrets to fork PR runs). No Antigravity install/component/script assertions ran in this build. This is expected for fork PRs, not a pass."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            failure) echo "Antigravity Tier 2 coverage: FAILED — see the step above and the job summary." ;;
            *) echo "Antigravity Tier 2 coverage: outcome '${{ steps.antigravity_install.outcome }}' unrecognized." ;;
          esac

          case "${{ steps.antigravity_hooks.outcome }}" in
            success) echo "Antigravity hook-resolution coverage: RAN and PASSED." ;;
            skipped) echo "Antigravity hook-resolution coverage: SKIPPED (install step did not succeed — see above)." ;;
            failure) {
                echo "### :red_circle: Antigravity hook-resolution coverage: FAILED"
                echo "Antigravity's compiled hooks/hooks.json (core/hooks/hooks.spec.json -> scripts/compile_prompts.py, #173/#170) no longer resolves under Antigravity's own env vars. This is a real regression — the step is load-bearing (no continue-on-error) and fails the job."
              } >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "Antigravity hook-resolution coverage: outcome '${{ steps.antigravity_hooks.outcome }}' unrecognized." ;;
          esac

      # Tier 2 — Copilot harness install + component registration (issue #127
      # AC#1). Unlike Antigravity, this needs NO secret: `copilot plugin
      # install`/`copilot plugin marketplace add` only read/copy the local
      # marketplace directory and make no authenticated API call, so this is a
      # hard, always-run gate (same shape as the Claude Code Tier 2 steps
      # above), not an optional/secret-gated tier. GH_TOKEN/GITHUB_TOKEN/
      # COPILOT_GITHUB_TOKEN are explicitly unset below to prove that boundary
      # in-workflow, mirroring the Claude Code "auth-boundary probe" step.
      - name: Tier 2 — Copilot harness install + component registration
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          COPILOT_GITHUB_TOKEN: ""
          HOME: ${{ github.workspace }}/.copilot-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"

          echo "Installing GitHub Copilot CLI (pinned, no auth token set)..."
          npm i -g "@github/copilot@${COPILOT_CLI_VERSION}"
          copilot --version

          echo "Adding local marketplace and installing marc@nexaduo..."
          copilot plugin marketplace add ./
          copilot plugin install marc@nexaduo

          echo "== assert plugin marc@nexaduo installed (plugin list) =="
          copilot plugin list | grep -qi "marc@nexaduo"

          echo "== assert skills registered (skill list) =="
          SKILLS="$(copilot skill list)"
          echo "$SKILLS"
          for skill in init tech-lead; do
            echo "$SKILLS" | grep -qiw "$skill" \
              || { echo "::error::skill '$skill' not registered in copilot skill list"; exit 1; }
          done

          echo "== assert specialist agents registered (installed-plugins files) =="
          AGENTS_DIR="$HOME/.copilot/installed-plugins/nexaduo/marc/agents"
          for component in engineer sre design security review research; do
            test -f "$AGENTS_DIR/$component.md" || {
              echo "::error::agent '$component' not found under $AGENTS_DIR"
              exit 1
            }
          done

          # Hooks resolution against the INSTALLED copy (issue #167 AC#2).
          # Tier 1 only schema-checks hooks.json in the checked-out tree;
          # nothing before this asserted the installed copy.
          echo "== assert hooks.json present + well-formed against the INSTALLED copy =="
          HOOKS_JSON="$HOME/.copilot/installed-plugins/nexaduo/marc/hooks/hooks.json"
          test -f "$HOOKS_JSON" || { echo "::error::installed hooks.json missing at $HOOKS_JSON"; exit 1; }
          jq -e '.version==1 and (.hooks|type=="object")' "$HOOKS_JSON" > /dev/null \
            || { echo "::error::installed hooks.json at $HOOKS_JSON fails the version==1 / .hooks-is-object shape"; exit 1; }

          # Bundled-script resolution against the INSTALLED copy (issue #167
          # AC#1). Copilot's plugin-root equivalent, COPILOT_PLUGIN_DATA, is
          # NOT installed-plugins/ itself: the sessionStart hook's own command
          # (below) copies core/scripts/*.py from installed-plugins into
          # COPILOT_PLUGIN_DATA (default $HOME/.copilot/plugin-data/marc) at
          # runtime, and postToolUse then invokes scripts from THAT location.
          # Proving resolution against the installed copy means actually
          # running that documented copy step (extracted straight from the
          # installed hooks.json), the same "exercise the hook's own command
          # directly, not through the CLI's hook dispatcher" pattern already
          # used for Claude Code's hook self-tests elsewhere in this file.
          echo "== assert bundled scripts resolve via \${COPILOT_PLUGIN_DATA} against the INSTALLED copy =="
          export COPILOT_PLUGIN_DATA="$HOME/.copilot/plugin-data/marc"
          # sessionStart now has TWO entries (#173: hooks.json is compiled from
          # core/hooks/hooks.spec.json, one hook id per array entry — the
          # team.toml dump and the plugin-data script-copy are separate hooks,
          # not one combined command). Run BOTH, in order, the same way the
          # real Copilot CLI dispatch would.
          SESSION_START_COUNT="$(jq '.hooks.sessionStart | length' "$HOOKS_JSON")"
          test "$SESSION_START_COUNT" -ge 1 \
            || { echo "::error::installed hooks.json has no sessionStart entries"; exit 1; }
          for i in $(seq 0 $((SESSION_START_COUNT - 1))); do
            SESSION_START_BASH="$(jq -r ".hooks.sessionStart[$i].bash" "$HOOKS_JSON")"
            test -n "$SESSION_START_BASH" && [ "$SESSION_START_BASH" != "null" ] \
              || { echo "::error::could not extract sessionStart[$i] hook 'bash' command from $HOOKS_JSON"; exit 1; }
            bash -c "$SESSION_START_BASH"
          done

          SCRIPT_REFS="$(grep -rhoE '\$\{COPILOT_PLUGIN_DATA:-\.\}/scripts/[A-Za-z0-9_.-]+' "$HOME"/.copilot/installed-plugins/nexaduo/marc/skills/*/SKILL.md | sed -E 's#.*/scripts/##' | sort -u)"
          test -n "$SCRIPT_REFS" || { echo "::error::no \${COPILOT_PLUGIN_DATA}/scripts/* references found in installed SKILL.md files"; exit 1; }
          while IFS= read -r name; do
            resolved="$COPILOT_PLUGIN_DATA/scripts/$name"
            test -f "$resolved" || { echo "::error::installed script '$name' referenced from SKILL.md did not land at $resolved after running the sessionStart hook's own copy step"; exit 1; }
            python3 "$resolved" --help > /dev/null \
              || { echo "::error::installed script '$name' at $resolved is not executable via python3 (--help failed)"; exit 1; }
            echo "OK: \${COPILOT_PLUGIN_DATA}/scripts/$name resolves and runs from the installed copy ($resolved), populated by the real sessionStart hook logic"
          done <<< "$SCRIPT_REFS"

          POST_TOOL_USE_BASH="$(jq -r '.hooks.postToolUse[0].bash' "$HOOKS_JSON")"
          echo "$POST_TOOL_USE_BASH" | grep -q 'COPILOT_PLUGIN_DATA' \
            || { echo "::error::postToolUse hook no longer references COPILOT_PLUGIN_DATA — update this assertion"; exit 1; }
          test -f "$COPILOT_PLUGIN_DATA/scripts/token_sentinel.py" \
            || { echo "::error::token_sentinel.py (referenced by the postToolUse hook) is not present at $COPILOT_PLUGIN_DATA/scripts/token_sentinel.py"; exit 1; }
          echo "OK: postToolUse hook's \${COPILOT_PLUGIN_DATA}/scripts/token_sentinel.py resolves from the installed copy"

          echo "NOTE: this executes the documented sessionStart/postToolUse hook COMMANDS directly"
          echo "and proves their copy-then-resolve mechanism works end-to-end against the real"
          echo "installed plugin. It does NOT prove the Copilot CLI itself dispatches these events"
          echo "through hooks.json — no Tier 1/2 step anywhere triggers a real Copilot CLI hook event."

          echo "Copilot harness check: OK (plugin installed with no auth token, tech-lead+init skills, all six specialist agents, hooks.json, and bundled scripts all resolve against the installed copy)."

      # 8. Cross-repo proof: from a working directory OUTSIDE the mARC checkout,
      #    with its OWN fresh config dir, add the marketplace by pointing at the
      #    mARC checkout path and prove registration there. This is the whole
      #    point of packaging the team as a portable plugin.
      - name: Tier 2 — cross-repo registration (outside the repo)
        env:
          ANTHROPIC_API_KEY: ""
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/.marc-xrepo-cfg
          MARC_CHECKOUT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_CONFIG_DIR"
          SANDBOX="$(mktemp -d "${RUNNER_TEMP}/marc-consumer-XXXXXX")"
          cd "$SANDBOX"
          echo "consumer sandbox: $SANDBOX (outside $MARC_CHECKOUT)"

          # Point the marketplace at the mARC checkout by absolute path.
          claude plugin marketplace add "$MARC_CHECKOUT"
          claude plugin install marc@nexaduo

          claude plugin list --json | jq -e '.[] | select(.id=="marc@nexaduo" and .enabled==true)' > /dev/null
          DETAILS="$(claude plugin details marc@nexaduo)"
          echo "$DETAILS"
          for component in tech-lead engineer sre design security review research; do
            echo "$DETAILS" | grep -qiw "$component" \
              || { echo "::error::cross-repo: component '$component' not registered"; exit 1; }
          done
          echo "Cross-repo: marc@nexaduo installs and registers from outside the mARC repo."

      # 9. Plugin upgrade path proof: prove that upgrading an existing installed
      #    plugin (origin/main) to the current PR's version works successfully.
      - name: Tier 2 — plugin upgrade path
        env:
          ANTHROPIC_API_KEY: ""
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/.marc-upgrade-cfg
          MARC_CHECKOUT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p "$CLAUDE_CONFIG_DIR"

          # This job's checkout is shallow (fetch-depth: 1) and only fetches the
          # PR ref, so origin/main does not exist in the object database yet.
          # Fetch just that ref (no credentials needed, it's the same public
          # remote already configured by actions/checkout) before archiving it.
          # This intentionally keeps the credential-free `git archive` approach
          # from the PR (chosen so fork PRs never need a credentialed clone)
          # instead of switching to `git clone`.
          git fetch --depth=1 origin main

          # Extract the origin/main version of the repo into a temp directory
          PREV_DIR="${{ runner.temp }}/marc-prev"
          rm -rf "$PREV_DIR"
          mkdir -p "$PREV_DIR"
          git archive origin/main | tar -x -C "$PREV_DIR"

          # If the old branch has a compilation script, compile it (just in case)
          if [ -f "$PREV_DIR/scripts/compile_prompts.py" ]; then
            python3 "$PREV_DIR/scripts/compile_prompts.py"
          fi

          echo "== Install previous version from origin/main =="
          claude plugin marketplace add "$PREV_DIR"
          claude plugin install marc@nexaduo

          claude plugin list --json | jq -e '.[] | select(.id=="marc@nexaduo" and .enabled==true)' > /dev/null

          echo "== Point marketplace to the current checkout and upgrade =="
          claude plugin marketplace add "$MARC_CHECKOUT"
          claude plugin update marc@nexaduo

          echo "== Assert upgraded plugin details =="
          DETAILS="$(claude plugin details marc@nexaduo)"
          echo "$DETAILS"
          for component in tech-lead engineer sre design security review research; do
            echo "$DETAILS" | grep -qiw "$component" \
              || { echo "::error::upgrade: component '$component' not registered after upgrade"; exit 1; }
          done
          echo "Upgrade path: plugin successfully upgrades from main release to PR version."
